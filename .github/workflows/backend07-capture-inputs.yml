name: Explicit Inputs capture adapter (refactor then compile only)
on:
  workflow_dispatch:
  push:
    branches:
      - feat/div256-capture-inputs
      - feat/div256-capture-inputs-repair
      - feat/div256-allocation-config-light
      - feat/div256-capture-inputs-view-repair
      - feat/div256-capture-inputs-encoder-repair
permissions:
  contents: read
jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch isolated Mathlib cache
        working-directory: examples/pancake-div256
        run: |
          cmp ../../lean-toolchain lean-toolchain
          lake exe cache get
      - name: Apply recorded Flapjack compatibility patch
        working-directory: examples/pancake-div256
        run: python3 prepare-flapjack.py
      - name: Verify pinned external cache source roots
        working-directory: examples/pancake-div256
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          manifest = json.loads(Path('lake-manifest.json').read_text())
          pins = {p['name']: p['rev'] for p in manifest['packages'] if p['type'] == 'git'}
          for name in ['Guest', 'flapjack']:
              root = (Path('.lake/packages') / name).resolve(strict=True)
              if not root.is_relative_to(workspace):
                  raise SystemExit(f'external cache package escapes CI workspace: {name}')
              actual = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pins[name]:
                  raise SystemExit(f'wrong pinned package revision: {name}')
          guest = Path('.lake/packages/Guest')
          dirty = subprocess.check_output(['git', '-C', str(guest), 'status', '--porcelain', '--untracked-files=no'])
          if dirty:
              raise SystemExit('Guest tracked sources changed before cache restore')
          PYTHON
      # Cache only pinned upstream build products, after exact patch validation.
      # Sources, example build output, executables and release archives stay out.
      - name: Restore completed DIV deployment dependencies
        id: div-dependency-complete-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          enableCrossOsArchive: false
          path: |
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
            examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
          key: div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-complete-deployment-proofs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-complete-deployment-proofs-
      - name: Restore DIV dependency progress fallback
        if: steps.div-dependency-complete-cache.outputs.cache-matched-key == ''
        id: div-dependency-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          enableCrossOsArchive: false
          path: |
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
            examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
          key: div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-progress-${{ github.run_id }}-${{ github.run_attempt }}-final
          restore-keys: |
            div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-progress-
            div256-external-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-
      - name: Pin fresh helper source and policy
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root=Path.cwd().resolve(strict=True); example=root/'examples/pancake-div256'
          evidence=root/'capture-inputs-helper-evidence'
          if evidence.exists()or evidence.is_symlink():raise SystemExit('refuse existing phase evidence')
          local=example/'.lake/build/lib/lean/PancakeDiv256'
          for parent in [local,*local.parents]:
              if parent==root:break
              if parent.is_symlink():raise SystemExit('proof namespace alias')
          if local.exists()and any(p.is_symlink()or p.suffix=='.olean'for p in local.rglob('*')):raise SystemExit('project proof objects already exist')
          manifest_name='examples/pancake-div256/backend07-capture-inputs-source-manifest.json'
          raw=(root/manifest_name).read_bytes()
          if hashlib.sha256(raw).hexdigest()!='2d546164ef60434f61715ee2f9a473b9abfffa3597b1297ef78e6a6d2bffe94e':raise SystemExit('phase source manifest changed')
          data=json.loads(raw); selection=data['phases']['helper']; expected={}
          for name in selection['local_modules']:
              row=data['modules'][name]; expected['examples/pancake-div256/'+row['path']]=row['sha256']
          for row in data['negative_sources']:expected['examples/pancake-div256/'+row['path']]=row['sha256']
          policy=['.github/workflows/backend07-capture-inputs.yml','lean-toolchain','lakefile.toml','lake-manifest.json',
              'examples/pancake-div256/lean-toolchain','examples/pancake-div256/lakefile.toml',
              'examples/pancake-div256/lake-manifest.json','examples/pancake-div256/prepare-flapjack.py',
              'examples/pancake-div256/patches/flapjack-lean435-compat.patch',manifest_name,
              'examples/pancake-div256/check-backend07-capture-inputs-sources.py']
          paths=sorted(set(expected)|set(policy)); blobs={}
          for line in subprocess.check_output(['git','ls-tree','-r','HEAD','--',*paths],text=True).splitlines():
              metadata,name=line.split('\t',1);mode,kind,oid=metadata.split()
              if kind!='blob'or mode not in ['100644','100755']:raise SystemExit('nonregular committed source')
              blobs[name]=oid
          if set(blobs)!=set(paths):raise SystemExit('uncommitted phase source/policy')
          records={}
          for name in paths:
              path=root/name
              if path.is_symlink()or path.resolve(strict=True)!=path:raise SystemExit('source alias')
              content=path.read_bytes(); h=hashlib.sha256(content).hexdigest(); oid=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              if oid!=blobs[name]or(name in expected and h!=expected[name]):raise SystemExit('source differs from committed/reviewed bytes')
              records[name]={'sha256':h,'git_blob':oid}
          sdk={}
          for tool in ['lean','lake']:
              path=Path(subprocess.check_output(['elan','which',tool],cwd=example,text=True).strip()).resolve(strict=True)
              sdk[tool]={'path':str(path),'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
                'version':subprocess.check_output([str(path),'--version'],text=True).strip()}
          packages={}
          for name in ['Guest','flapjack']:
              path=(example/'.lake/packages'/name).resolve(strict=True)
              packages[name]={'path':str(path),'commit':subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip(),
                'diff_sha256':hashlib.sha256(subprocess.check_output(['git','-C',str(path),'diff','--binary','HEAD','--'])).hexdigest()}
          evidence.mkdir()
          report={'phase':'helper','certificate':False,'active':False,'checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
           'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'files':records,'sdk':sdk,'prepared_packages':packages,
           'source_manifest_sha256':'2d546164ef60434f61715ee2f9a473b9abfffa3597b1297ef78e6a6d2bffe94e','local_modules':selection['local_modules'],'fresh_local_namespace':True,
           'runtime_execution':False,'compiler_correctness_claim':False,
           'run_metadata':{k:os.environ.get(k)for k in ['GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_SHA','GITHUB_REF']}}
          (evidence/'sources-before.json').write_text(json.dumps(report,indent=2)+'\n')
          print('Fresh helper phase provenance pinned:',len(selection['local_modules']),'local sources')
          PYTHON
      - name: Build five refactor goals and two-owner audit
        working-directory: examples/pancake-div256
        run: |
          set -euo pipefail
          {
            python3 check-backend07-capture-inputs-sources.py --phase helper --manifest-sha256 2d546164ef60434f61715ee2f9a473b9abfffa3597b1297ef78e6a6d2bffe94e
            lake --fail-fast build PancakeDiv256.Compiler.Backend07CaptureInputsRefactorChecks
            python3 check-backend07-capture-inputs-sources.py --phase helper --manifest-sha256 2d546164ef60434f61715ee2f9a473b9abfffa3597b1297ef78e6a6d2bffe94e
          } 2>&1 | tee ../../capture-inputs-helper-evidence/build.log
      - name: Reject changed encoder, FFI order, original view and row counter
        working-directory: examples/pancake-div256
        run: |
          set -euo pipefail
          lake env python3 - <<'PYNEG' 2>&1 | tee ../../capture-inputs-helper-evidence/negative.log
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          with tempfile.TemporaryDirectory(prefix="backend07-input-negatives-") as directory:
              for name, witness in [("WrongEncoder", "encodeRowsWith_riscv"), ("WrongFfiOrder", "encodeRowsWith_riscv"), ("WrongConfigView", "captureInputs_literal07"), ("WrongRowCounter", "encodeRowsWith_riscv")]:
                  output = Path(directory) / (name + ".olean")
                  result = subprocess.run(["lean", "-o", str(output), "tests/backend07-capture-inputs/" + name + ".lean"], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=300)
                  diagnostic = result.stdout
                  print(name + ": expected typed rejection\n" + diagnostic[-20000:])
                  lower = diagnostic.lower()
                  if result.returncode != 1 or output.exists() or output.is_symlink() or lower.count("error:") != 1 or "type mismatch" not in lower or re.search(r"(?<![\w'])" + re.escape(witness) + r"(?![\w'])", diagnostic) is None or any(text in lower for text in ["unknown identifier", "unknown constant", "unknown module", "object file", "unexpected token", "expected token", "unexpected end of input", "unterminated", "parser error", "invalid syntax", "failed to synthesize"]):
                      raise SystemExit(name + ": expected typed proof mismatch without output")
          PYNEG
      - name: Recheck helper provenance and inventory
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,re,subprocess
          from pathlib import Path
          root=Path.cwd().resolve(strict=True);evidence=root/'capture-inputs-helper-evidence'
          before=json.loads((evidence/'sources-before.json').read_bytes())
          if subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()!=before['checkout']or subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()!=before['tree']:raise SystemExit('checkout changed')
          for name,row in before['files'].items():
              path=root/name
              if path.is_symlink()or path.resolve(strict=True)!=path or hashlib.sha256(path.read_bytes()).hexdigest()!=row['sha256']:raise SystemExit('phase source/policy changed')
          for tool,row in before['sdk'].items():
              path=Path(subprocess.check_output(['elan','which',tool],cwd=root/'examples/pancake-div256',text=True).strip()).resolve(strict=True)
              if str(path)!=row['path']or hashlib.sha256(path.read_bytes()).hexdigest()!=row['sha256']or subprocess.check_output([str(path),'--version'],text=True).strip()!=row['version']:raise SystemExit('SDK changed')
          for row in before['prepared_packages'].values():
              commit=subprocess.check_output(['git','-C',row['path'],'rev-parse','HEAD'],text=True).strip();diff=subprocess.check_output(['git','-C',row['path'],'diff','--binary','HEAD','--'])
              if commit!=row['commit']or hashlib.sha256(diff).hexdigest()!=row['diff_sha256']:raise SystemExit('prepared dependency changed')
          text=(evidence/'build.log').read_text();audit=None
          if 'helper'=='helper':
              rows=re.findall(r'CaptureInputs refactor-only strict audit: 2 owners / (\d+) declarations / (\d+) theorems / 0 offenders',text)
              if len(rows)!=1 or int(rows[0][0])==0 or int(rows[0][1])<5:raise SystemExit('missing helper-only strict audit')
              audit={'owners':2,'theorems':int(rows[0][1]),'unexpected_axioms':0,'only_untrusted_trace_refactor':True}
          objects={}
          for name in before['local_modules']:
              relative=name.replace('.','/')+'.olean';path=root/'examples/pancake-div256/.lake/build/lib/lean'/relative
              if not path.is_file()or path.is_symlink()or path.resolve(strict=True)!=path:raise SystemExit('missing/aliased compiled phase object')
              objects[relative]=hashlib.sha256(path.read_bytes()).hexdigest()
          if len(objects)!=36:raise SystemExit('wrong local phase inventory')
          report={'phase':'helper','certificate':False,'active':False,'source_before_sha256':hashlib.sha256((evidence/'sources-before.json').read_bytes()).hexdigest(),
           'build_log_sha256':hashlib.sha256((evidence/'build.log').read_bytes()).hexdigest(),'audit':audit,'objects':objects,
           'runtime_execution':False,'runtime_phase_is_compile_only':'helper'=='runtime','compiler_or_byte_certificate':False,'Root_acceptance':'pending'}
          (evidence/'checked-artifacts.json').write_text(json.dumps(report,indent=2)+'\n')
          print('helper phase complete; no writer/capture or compiler-correctness result')
          PYTHON
      - name: Preserve bounded helper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-inputs-helper-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            capture-inputs-helper-evidence/sources-before.json
            capture-inputs-helper-evidence/build.log
            capture-inputs-helper-evidence/checked-artifacts.json
            capture-inputs-helper-evidence/negative.log
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/Backend07/ContextInputsProposal/CaptureInputs.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/Backend07/ContextInputsProposal/OriginalViewGoals.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/Backend07CaptureInputsRefactorChecks.olean
  runtime:
    needs: helper
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch isolated Mathlib cache
        working-directory: examples/pancake-div256
        run: |
          cmp ../../lean-toolchain lean-toolchain
          lake exe cache get
      - name: Apply recorded Flapjack compatibility patch
        working-directory: examples/pancake-div256
        run: python3 prepare-flapjack.py
      - name: Verify pinned external cache source roots
        working-directory: examples/pancake-div256
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          manifest = json.loads(Path('lake-manifest.json').read_text())
          pins = {p['name']: p['rev'] for p in manifest['packages'] if p['type'] == 'git'}
          for name in ['Guest', 'flapjack']:
              root = (Path('.lake/packages') / name).resolve(strict=True)
              if not root.is_relative_to(workspace):
                  raise SystemExit(f'external cache package escapes CI workspace: {name}')
              actual = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pins[name]:
                  raise SystemExit(f'wrong pinned package revision: {name}')
          guest = Path('.lake/packages/Guest')
          dirty = subprocess.check_output(['git', '-C', str(guest), 'status', '--porcelain', '--untracked-files=no'])
          if dirty:
              raise SystemExit('Guest tracked sources changed before cache restore')
          PYTHON
      # Cache only pinned upstream build products, after exact patch validation.
      # Sources, example build output, executables and release archives stay out.
      - name: Restore completed DIV deployment dependencies
        id: div-dependency-complete-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          enableCrossOsArchive: false
          path: |
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
            examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
          key: div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-complete-deployment-proofs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-complete-deployment-proofs-
      - name: Restore DIV dependency progress fallback
        if: steps.div-dependency-complete-cache.outputs.cache-matched-key == ''
        id: div-dependency-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          enableCrossOsArchive: false
          path: |
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
            examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
          key: div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-progress-${{ github.run_id }}-${{ github.run_attempt }}-final
          restore-keys: |
            div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-progress-
            div256-external-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-
      - name: Pin fresh runtime source and policy
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root=Path.cwd().resolve(strict=True); example=root/'examples/pancake-div256'
          evidence=root/'capture-inputs-runtime-evidence'
          if evidence.exists()or evidence.is_symlink():raise SystemExit('refuse existing phase evidence')
          local=example/'.lake/build/lib/lean/PancakeDiv256'
          for parent in [local,*local.parents]:
              if parent==root:break
              if parent.is_symlink():raise SystemExit('proof namespace alias')
          if local.exists()and any(p.is_symlink()or p.suffix=='.olean'for p in local.rglob('*')):raise SystemExit('project proof objects already exist')
          manifest_name='examples/pancake-div256/backend07-capture-inputs-source-manifest.json'
          raw=(root/manifest_name).read_bytes()
          if hashlib.sha256(raw).hexdigest()!='2d546164ef60434f61715ee2f9a473b9abfffa3597b1297ef78e6a6d2bffe94e':raise SystemExit('phase source manifest changed')
          data=json.loads(raw); selection=data['phases']['runtime']; expected={}
          for name in selection['local_modules']:
              row=data['modules'][name]; expected['examples/pancake-div256/'+row['path']]=row['sha256']
          for row in data['negative_sources']:expected['examples/pancake-div256/'+row['path']]=row['sha256']
          policy=['.github/workflows/backend07-capture-inputs.yml','lean-toolchain','lakefile.toml','lake-manifest.json',
              'examples/pancake-div256/lean-toolchain','examples/pancake-div256/lakefile.toml',
              'examples/pancake-div256/lake-manifest.json','examples/pancake-div256/prepare-flapjack.py',
              'examples/pancake-div256/patches/flapjack-lean435-compat.patch',manifest_name,
              'examples/pancake-div256/check-backend07-capture-inputs-sources.py']
          paths=sorted(set(expected)|set(policy)); blobs={}
          for line in subprocess.check_output(['git','ls-tree','-r','HEAD','--',*paths],text=True).splitlines():
              metadata,name=line.split('\t',1);mode,kind,oid=metadata.split()
              if kind!='blob'or mode not in ['100644','100755']:raise SystemExit('nonregular committed source')
              blobs[name]=oid
          if set(blobs)!=set(paths):raise SystemExit('uncommitted phase source/policy')
          records={}
          for name in paths:
              path=root/name
              if path.is_symlink()or path.resolve(strict=True)!=path:raise SystemExit('source alias')
              content=path.read_bytes(); h=hashlib.sha256(content).hexdigest(); oid=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              if oid!=blobs[name]or(name in expected and h!=expected[name]):raise SystemExit('source differs from committed/reviewed bytes')
              records[name]={'sha256':h,'git_blob':oid}
          sdk={}
          for tool in ['lean','lake']:
              path=Path(subprocess.check_output(['elan','which',tool],cwd=example,text=True).strip()).resolve(strict=True)
              sdk[tool]={'path':str(path),'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
                'version':subprocess.check_output([str(path),'--version'],text=True).strip()}
          packages={}
          for name in ['Guest','flapjack']:
              path=(example/'.lake/packages'/name).resolve(strict=True)
              packages[name]={'path':str(path),'commit':subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip(),
                'diff_sha256':hashlib.sha256(subprocess.check_output(['git','-C',str(path),'diff','--binary','HEAD','--'])).hexdigest()}
          evidence.mkdir()
          report={'phase':'runtime','certificate':False,'active':False,'checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
           'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'files':records,'sdk':sdk,'prepared_packages':packages,
           'source_manifest_sha256':'2d546164ef60434f61715ee2f9a473b9abfffa3597b1297ef78e6a6d2bffe94e','local_modules':selection['local_modules'],'fresh_local_namespace':True,
           'runtime_execution':False,'compiler_correctness_claim':False,
           'run_metadata':{k:os.environ.get(k)for k in ['GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_SHA','GITHUB_REF']}}
          (evidence/'sources-before.json').write_text(json.dumps(report,indent=2)+'\n')
          print('Fresh runtime phase provenance pinned:',len(selection['local_modules']),'local sources')
          PYTHON
      - name: Build Inputs callable tooling without evaluation
        working-directory: examples/pancake-div256
        run: |
          set -euo pipefail
          {
            python3 check-backend07-capture-inputs-sources.py --phase runtime --manifest-sha256 2d546164ef60434f61715ee2f9a473b9abfffa3597b1297ef78e6a6d2bffe94e
            lake --fail-fast build PancakeDiv256.Compiler.Backend07CaptureInputsRuntimeChecks
            python3 check-backend07-capture-inputs-sources.py --phase runtime --manifest-sha256 2d546164ef60434f61715ee2f9a473b9abfffa3597b1297ef78e6a6d2bffe94e
          } 2>&1 | tee ../../capture-inputs-runtime-evidence/build.log
      - name: Recheck runtime provenance and inventory
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,re,subprocess
          from pathlib import Path
          root=Path.cwd().resolve(strict=True);evidence=root/'capture-inputs-runtime-evidence'
          before=json.loads((evidence/'sources-before.json').read_bytes())
          if subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()!=before['checkout']or subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()!=before['tree']:raise SystemExit('checkout changed')
          for name,row in before['files'].items():
              path=root/name
              if path.is_symlink()or path.resolve(strict=True)!=path or hashlib.sha256(path.read_bytes()).hexdigest()!=row['sha256']:raise SystemExit('phase source/policy changed')
          for tool,row in before['sdk'].items():
              path=Path(subprocess.check_output(['elan','which',tool],cwd=root/'examples/pancake-div256',text=True).strip()).resolve(strict=True)
              if str(path)!=row['path']or hashlib.sha256(path.read_bytes()).hexdigest()!=row['sha256']or subprocess.check_output([str(path),'--version'],text=True).strip()!=row['version']:raise SystemExit('SDK changed')
          for row in before['prepared_packages'].values():
              commit=subprocess.check_output(['git','-C',row['path'],'rev-parse','HEAD'],text=True).strip();diff=subprocess.check_output(['git','-C',row['path'],'diff','--binary','HEAD','--'])
              if commit!=row['commit']or hashlib.sha256(diff).hexdigest()!=row['diff_sha256']:raise SystemExit('prepared dependency changed')
          text=(evidence/'build.log').read_text();audit=None
          if 'runtime'=='helper':
              rows=re.findall(r'CaptureInputs refactor-only strict audit: 2 owners / (\d+) declarations / (\d+) theorems / 0 offenders',text)
              if len(rows)!=1 or int(rows[0][0])==0 or int(rows[0][1])<5:raise SystemExit('missing helper-only strict audit')
              audit={'owners':2,'theorems':int(rows[0][1]),'unexpected_axioms':0,'only_untrusted_trace_refactor':True}
          objects={}
          for name in before['local_modules']:
              relative=name.replace('.','/')+'.olean';path=root/'examples/pancake-div256/.lake/build/lib/lean'/relative
              if not path.is_file()or path.is_symlink()or path.resolve(strict=True)!=path:raise SystemExit('missing/aliased compiled phase object')
              objects[relative]=hashlib.sha256(path.read_bytes()).hexdigest()
          if len(objects)!=876:raise SystemExit('wrong local phase inventory')
          report={'phase':'runtime','certificate':False,'active':False,'source_before_sha256':hashlib.sha256((evidence/'sources-before.json').read_bytes()).hexdigest(),
           'build_log_sha256':hashlib.sha256((evidence/'build.log').read_bytes()).hexdigest(),'audit':audit,'objects':objects,
           'runtime_execution':False,'runtime_phase_is_compile_only':'runtime'=='runtime','compiler_or_byte_certificate':False,'Root_acceptance':'pending'}
          (evidence/'checked-artifacts.json').write_text(json.dumps(report,indent=2)+'\n')
          print('runtime phase complete; no writer/capture or compiler-correctness result')
          PYTHON
      - name: Preserve bounded runtime evidence
        if: always()
