# Attach platform-independent RiscvZkvm.Sail oleans to each GitHub release. Lake
# downloads this archive automatically for consumers pinned to the release tag.
name: Release prebuilt oleans

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or backfill
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-oleans:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) tag='${{ inputs.tag }}' ;;
            push) tag='${{ github.ref_name }}' ;;
          esac
          test -n "$tag" || { echo "::error::could not resolve release tag"; exit 1; }
          git fetch --tags --force --quiet
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
            || { echo "::error::tag '$tag' does not exist"; exit 1; }
          git checkout --quiet "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ steps.resolve.outputs.tag }}'
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --verify-tag --title "$tag" --generate-notes

      # Keep this job uncached, unlike build.yml. A release archive is the one
      # artifact that must be reproducible from source at the tag: restoring
      # `.lake` here would let a previously built object reach consumers without
      # ever being rebuilt from the tagged tree. The `rm -rf .lake/build` below
      # depends on that too -- it can only guarantee a clean build directory if
      # nothing repopulates it. Do not add a cache to this workflow.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      # Only the platform-independent libraries, into a wiped build directory.
      # `lake upload` packs `.lake/build` wholesale, so building `riscv-zkvm-run`
      # here would put native, platform-specific output into an archive that
      # every platform unpacks. Do not add it.
      - name: Build only the platform-independent libraries
        run: |
          rm -rf .lake/build
          lake build \
            RiscvZkvm.Sail \
            RiscvZkvm.Rv64 \
            RiscvZkvm.Rv64.SailEquiv \
            RiscvZkvm.Interpreter
          if [ -e .lake/build/bin ]; then
            echo "::error::.lake/build/bin exists; a platform-specific target was built"
            exit 1
          fi

      - name: Pack and attach archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lake upload "${{ steps.resolve.outputs.tag }}"

      - name: Verify a tagged consumer uses the release archive
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          consumer="$RUNNER_TEMP/riscv-zkvm-cache-smoke"
          mkdir -p "$consumer"
          cp lean-toolchain "$consumer/lean-toolchain"
          cat > "$consumer/lakefile.toml" <<EOF
          name = "riscv-zkvm-cache-smoke"
          version = "0.0.0"

          [[require]]
          name = "riscv-zkvm"
          git = "https://github.com/${{ github.repository }}"
          rev = "$RELEASE_TAG"

          [[lean_lib]]
          name = "CacheSmoke"
          EOF
          # Import everything a downstream consumer (evm-asm) actually uses, so
          # the check covers the whole archive rather than just the Sail model.
          cat > "$consumer/CacheSmoke.lean" <<'EOF'
          import RiscvZkvm.Sail
          import RiscvZkvm.Rv64
          import RiscvZkvm.Rv64.SailEquiv
          import RiscvZkvm.Interpreter

          #check RiscvZkvm.Sail.Functions.xlen
          #check RiscvZkvm.Rv64.step
          #check RiscvZkvm.Rv64.SailEquiv.sailStepN_run_sim
          #check RiscvZkvm.Interpreter.decode
          EOF
          cd "$consumer"
          {
            lake update
            lake build CacheSmoke
          } 2>&1 | tee build.log
          if grep -Eq 'Built RiscvZkvm\.(Sail|Rv64|Interpreter)(\.| )' build.log; then
            echo "::error::tagged consumer rebuilt a library that should have come from the archive"
            grep -E 'Built RiscvZkvm\.' build.log
            exit 1
          fi
          for m in Sail Rv64 Rv64/SailEquiv Interpreter; do
            test -f ".lake/packages/riscv-zkvm/.lake/build/lib/lean/RiscvZkvm/$m.olean" \
              || { echo "::error::missing $m.olean in the unpacked archive"; exit 1; }
          done

      - name: Report archive
        run: |
          archive=.lake/riscv-zkvm-oleans.tar.gz
          test -f "$archive"
          {
            echo "### riscv-zkvm oleans for \`${{ steps.resolve.outputs.tag }}\`"
            echo
            echo "- Archive size: $(du -h "$archive" | cut -f1)"
            echo "- Entries: $(tar tzf "$archive" | wc -l | tr -d ' ')"
            echo "- .olean files: $(tar tzf "$archive" | grep -c '\.olean$')"
          } >> "$GITHUB_STEP_SUMMARY"
