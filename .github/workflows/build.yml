name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # `use-github-cache: false` is deliberate, and is NOT the same as "no
      # caching" -- see the restore/save pair below.
      #
      # lean-action's own cache save (action.yml:305) runs immediately after
      # lean-action's own build step (action.yml:296). We pass `build: false`
      # because the gates below need the build split across several invocations,
      # so that sequence is restore -> no build -> save. It faithfully stored an
      # empty `.lake/build` on every run: five consecutive runs took 45-53
      # minutes each, with no warm run faster than a cold one.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      # Restore `.lake` -- dependency sources and compiled oleans -- from a
      # previous run, and save it *after* the builds below have actually run.
      #
      # `RiscvZkvm.Sail` is ~45 of this job's ~46 minutes and changes only when
      # `regen-model.sh` is run, so nearly every push recompiles it for nothing.
      #
      # Safe against stale artifacts: Lake keys its traces on source content, not
      # timestamps, so a restored `.lake` cannot mask a changed module. It also
      # replays stored diagnostics for modules it skips --
      #
      #     [5/5] Replayed RiscvZkvm.Interpreter.DecodeTests
      #     warning: RiscvZkvm/Interpreter/DecodeTests.lean:75:19: ...
      #
      # -- so `check-no-warnings.sh` still sees warnings from modules that were
      # not recompiled. That was verified against this gate before enabling the
      # cache; it is the one gate a warm build could otherwise have falsely
      # greened. The source-level gates never build, and the axiom sweep and
      # interpreter tests read compiled output rather than the log.
      #
      # The key ends in the commit SHA so every push saves, and `restore-keys`
      # falls back to the newest cache sharing the toolchain and manifest.
      #
      # Cache scoping is the part that surprises people: a run can restore only
      # caches created on its own ref or on the default branch. So a topic branch
      # does NOT inherit a sibling branch's entry -- only pushes to `main`
      # populate the one every PR starts from, and a branch's first run is cold
      # even when another branch just built the identical tree.
      - name: Restore Lake build cache
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # --- source-level gates (no build required) ---------------------------

      - name: Verify generated-source pins
        run: scripts/check-model-pin.sh

      - name: Forbidden-tactic guard (no native_decide / bv_decide)
        run: scripts/check-forbidden-tactics.sh

      - name: Unimported-file check (hand-owned Lean reachable from a root)
        run: scripts/check-unimported.py
      - name: Check the SP1 syscall pin
        run: scripts/check-sp1-pin.sh

      - name: Confirm the package stays Mathlib-free
        run: |
          if grep -rn '^ *\(public \)\?import Mathlib' RiscvZkvm/; then
            echo "::error::RiscvZkvm must not depend on Mathlib"
            exit 1
          fi
          python3 - <<'EOF'
          import json, sys
          names = [p["name"] for p in json.load(open("lake-manifest.json"))["packages"]]
          if names != ["Sail"]:
              print(f"::error::expected exactly one dependency (Sail), got {names}")
              sys.exit(1)
          EOF

      # --- builds -----------------------------------------------------------
      #
      # The five published libraries. `riscv-zkvm-run` and `axiomsweep` are built
      # further down: they are platform-specific output and must never be present
      # when the release job packs the archive.

      - name: Build proof model
        run: lake build RiscvZkvm.Sail

      - name: Build machine model, Sail equivalence, program logic, and interpreter
        run: |
          lake build RiscvZkvm.Rv64 RiscvZkvm.Rv64.SailEquiv RiscvZkvm.Rv64.Logic \
            RiscvZkvm.Interpreter RiscvZkvm.Interpreter.DecodeTests 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: No-warnings guard (hand-owned Lean sources)
        run: scripts/check-no-warnings.sh build.log

      # --- post-build gates -------------------------------------------------

      - name: Axiom sweep (kernel truth; fails on any undocumented axiom)
        run: scripts/check-axioms.sh

      - name: Run the interpreter end to end
        run: |
          lake build riscv-zkvm-run
          scripts/run-interpreter-tests.sh

      # `always()`: a run that fails partway still saves the expensive
      # `RiscvZkvm.Sail` build, so the next push iterating on the fix starts
      # warm. Partial output is safe for the reason given above -- Lake's traces
      # are content hashes, so it resumes rather than trusting stale artifacts.
      # Skipped on an exact key hit (a re-run of the same commit), where the
      # entry already exists and `actions/cache` would error.
      - name: Save Lake build cache
        if: always() && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
