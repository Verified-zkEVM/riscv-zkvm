      - name: Build all 421 exact endpoints and audit 891 source owners
        working-directory: examples/pancake-div256
        run: |
          set -o pipefail
          lake --fail-fast build PancakeDiv256.Compiler.Native421Checks 2>&1 | tee ../../native421-evidence/build.log
      - name: Verify final source basis and record checked artifacts
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, re, subprocess
          from pathlib import Path
          root = Path.cwd().resolve(strict=True)
          evidence = root / 'native421-evidence'
          before = json.loads((evidence / 'sources-before.json').read_bytes())
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != before['checkout_commit']:
              raise SystemExit('checkout changed during checkpoint')
          for name, row in before['files'].items():
              path = root / name
              if path.is_symlink() or path.resolve(strict=True) != path or hashlib.sha256(path.read_bytes()).hexdigest() != row['sha256']:
                  raise SystemExit('source/policy bytes changed during checkpoint')
          kernel = before['kernel']
          if hashlib.sha256(Path(kernel['path']).read_bytes()).hexdigest() != kernel['sha256']:
              raise SystemExit('Kernel binary changed during checkpoint')
          for row in before['prepared_packages'].values():
              commit = subprocess.check_output(['git', '-C', row['path'], 'rev-parse', 'HEAD'], text=True).strip()
              diff = subprocess.check_output(['git', '-C', row['path'], 'diff', '--binary', 'HEAD', '--'])
              if commit != row['commit'] or hashlib.sha256(diff).hexdigest() != row['tracked_diff_sha256']:
                  raise SystemExit('prepared external package changed during checkpoint')
          text = (evidence / 'build.log').read_text()
          matches = re.findall(r'Native421 strict audit: 891 owners / (\d+) declarations / (\d+) theorems / 0 offenders', text)
          if len(matches) != 1 or int(matches[0][0]) == 0 or int(matches[0][1]) < 421:
              raise SystemExit('missing complete Native421 strict audit output')
          oleans = {}
          prefix = 'examples/pancake-div256/'
          for name in before['source_paths']:
              relative = name.removeprefix(prefix).removesuffix('.lean') + '.olean'
              path = root / prefix / '.lake/build/lib/lean' / relative
              if path.is_symlink() or not path.is_file() or path.resolve(strict=True) != path:
                  raise SystemExit('missing/aliased freshly built checkpoint object')
              oleans[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          if len(oleans) != 896:
              raise SystemExit('wrong checked local artifact inventory')
          report = {
              'kind': 'hosted Native421 Kernel checkpoint; Root acceptance review pending',
              'certificate': False, 'active': False, 'checkout_commit': before['checkout_commit'],
              'sources_before_sha256': hashlib.sha256((evidence / 'sources-before.json').read_bytes()).hexdigest(),
              'build_log_sha256': hashlib.sha256((evidence / 'build.log').read_bytes()).hexdigest(),
              'selected_owners': 891, 'declarations': int(matches[0][0]), 'theorems': int(matches[0][1]),
              'unexpected_axiom_offenders': 0, 'endpoint_count': 421, 'fresh_local_objects': oleans,
              'local03_report_synthesized': False, 'whole_program_certificate': False,
          }
          (evidence / 'checked-artifacts.json').write_text(json.dumps(report, indent=2) + '\n')
          print('Native421 checkpoint complete; Root acceptance and whole-program obligations remain separate')
          PYTHON
