name: Bounded Function64 runtime/original root proof pilot
'on':
  workflow_dispatch: null
  push:
    branches:
    - feat/div256-runtime-function64-root
    - feat/div256-runtime-function64-root-mi64
permissions:
  contents: read
jobs:
  runtime-function64-root:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '1'
      LEAN_STACK_SIZE_KB: '65536'
      MIMALLOC_ARENA_RESERVE: 64M
    steps:
    - uses: actions/checkout@v4
    - uses: leanprover/lean-action@v1
      with:
        auto-config: false
        build: false
        test: false
        lint: false
        use-github-cache: false
        use-mathlib-cache: false
    - name: Fetch isolated Mathlib cache
      working-directory: examples/pancake-div256
      run: |
        cmp ../../lean-toolchain lean-toolchain
        lake exe cache get
    - name: Apply recorded Flapjack compatibility patch
      working-directory: examples/pancake-div256
      run: python3 prepare-flapjack.py
    - name: Verify pinned external cache source roots
      working-directory: examples/pancake-div256
      run: |
        python3 - <<'PYTHON'
        import json, os, subprocess
        from pathlib import Path
        workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
        manifest = json.loads(Path('lake-manifest.json').read_text())
        pins = {p['name']: p['rev'] for p in manifest['packages'] if p['type'] == 'git'}
        for name in ['Guest', 'flapjack']:
            root = (Path('.lake/packages') / name).resolve(strict=True)
            if not root.is_relative_to(workspace):
                raise SystemExit(f'external cache package escapes CI workspace: {name}')
            actual = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
            if actual != pins[name]:
                raise SystemExit(f'wrong pinned package revision: {name}')
        guest = Path('.lake/packages/Guest')
        dirty = subprocess.check_output(['git', '-C', str(guest), 'status', '--porcelain', '--untracked-files=no'])
        if dirty:
            raise SystemExit('Guest tracked sources changed before cache restore')
        PYTHON
    - name: Restore completed DIV deployment dependencies
      id: div-dependency-complete-cache
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        enableCrossOsArchive: false
        path: |
          examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
          examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
          examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
          examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
        key: div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain',
          'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch')
          }}-complete-deployment-proofs-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-complete-deployment-proofs-
    - name: Restore DIV dependency progress fallback
      if: steps.div-dependency-complete-cache.outputs.cache-matched-key == ''
      id: div-dependency-cache
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        enableCrossOsArchive: false
        path: |
          examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
          examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
          examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
          examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
        key: div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain',
          'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch')
          }}-progress-${{ github.run_id }}-${{ github.run_attempt }}-final
        restore-keys: |
          div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-progress-
          div256-external-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-
    - name: Pin fresh five-module Function64 root source basis
      run: |
        python3 - <<'PYTHON'
        import hashlib, json, os, subprocess
        from pathlib import Path
        root=Path.cwd().resolve(strict=True); example=root/'examples/pancake-div256'
        evidence=root/'runtime-function64-root-evidence'
        if evidence.exists()or evidence.is_symlink():raise SystemExit('refuse existing phase evidence')
        local=example/'.lake/build/lib/lean/PancakeDiv256'
        for parent in [local,*local.parents]:
            if parent==root:break
            if parent.is_symlink():raise SystemExit('proof namespace alias')
        if local.exists()and any(p.is_symlink()or p.suffix=='.olean'for p in local.rglob('*')):raise SystemExit('project proof objects already exist')
        manifest_name='examples/pancake-div256/runtime-function64-root-source-manifest.json'
        raw=(root/manifest_name).read_bytes()
        if hashlib.sha256(raw).hexdigest()!='820b44f2059aef58a291e21079183c549ab81cd6952510bdc71649f6754afe2e':raise SystemExit('phase source manifest changed')
        data=json.loads(raw); selection={'local_modules':data['local_modules']}; expected={}
        repository_modules=sorted(n for n,row in data['modules'].items()if row['provider']=='repository')
        for name in repository_modules:
            target=root/'.lake/build/lib/lean'/(name.replace('.','/')+'.olean')
            if target.exists()or target.is_symlink():raise SystemExit('repository dependency object already exists')
        for name,row in data['modules'].items():
            if row['provider']=='consumer':expected['examples/pancake-div256/'+row['path']]=row['sha256']
            elif row['provider']=='repository':expected[row['path']]=row['sha256']
        for row in data['negative_sources']:expected['examples/pancake-div256/'+row['path']]=row['sha256']
        policy=['.github/workflows/runtime-function64-root.yml','lean-toolchain','lakefile.toml','lake-manifest.json',
            'examples/pancake-div256/lean-toolchain','examples/pancake-div256/lakefile.toml',
            'examples/pancake-div256/lake-manifest.json','examples/pancake-div256/prepare-flapjack.py',
            'examples/pancake-div256/patches/flapjack-lean435-compat.patch',manifest_name,
            'examples/pancake-div256/check-backend07-config-projection-sources.py',
            'examples/pancake-div256/check-runtime-function64-root.py',
            'examples/pancake-div256/tools/capture-context/providers.py',
            'examples/pancake-div256/tools/capture-context/policy.json',
            'examples/pancake-div256/tools/capture-context/bounded_capture.py']
        paths=sorted(set(expected)|set(policy)); blobs={}
        for line in subprocess.check_output(['git','ls-tree','-r','HEAD','--',*paths],text=True).splitlines():
            metadata,name=line.split('\t',1);mode,kind,oid=metadata.split()
            if kind!='blob'or mode not in ['100644','100755']:raise SystemExit('nonregular committed source')
            blobs[name]=oid
        if set(blobs)!=set(paths):raise SystemExit('uncommitted phase source/policy')
        records={}
        for name in paths:
            path=root/name
            if path.is_symlink()or path.resolve(strict=True)!=path:raise SystemExit('source alias')
            content=path.read_bytes(); h=hashlib.sha256(content).hexdigest(); oid=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
            if oid!=blobs[name]or(name in expected and h!=expected[name]):raise SystemExit('source differs from committed/reviewed bytes')
            records[name]={'sha256':h,'git_blob':oid}
        sdk={}
        for tool in ['lean','lake']:
            path=Path(subprocess.check_output(['elan','which',tool],cwd=example,text=True).strip()).resolve(strict=True)
            sdk[tool]={'path':str(path),'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
              'version':subprocess.check_output([str(path),'--version'],text=True).strip()}
        packages={}
        for name in ['Guest','flapjack']:
            path=(example/'.lake/packages'/name).resolve(strict=True)
            packages[name]={'path':str(path),'commit':subprocess.check_output(['git','-C',str(path),'rev-parse','HEAD'],text=True).strip(),
              'diff_sha256':hashlib.sha256(subprocess.check_output(['git','-C',str(path),'diff','--binary','HEAD','--'])).hexdigest()}
        evidence.mkdir()
        report={'phase':'runtime-function64-root','certificate':False,'active':False,'checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
         'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'files':records,'sdk':sdk,'prepared_packages':packages,
         'source_manifest_sha256':'820b44f2059aef58a291e21079183c549ab81cd6952510bdc71649f6754afe2e','local_modules':selection['local_modules'],'repository_modules':repository_modules,'fresh_local_namespace':True,
         'runtime_execution':False,'compiler_correctness_claim':False,
         'run_metadata':{k:os.environ.get(k)for k in ['GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_SHA','GITHUB_REF']}}
        (evidence/'sources-before.json').write_text(json.dumps(report,indent=2)+'\n')
        print('Fresh Function64 root pilot provenance pinned:',len(selection['local_modules']),'local sources')
        PYTHON
    - name: Prepare accepted smoke prerequisites then run bounded root checker and negatives
      working-directory: examples/pancake-div256
      run: |
        set -euo pipefail
        while IFS= read -r variable; do
          if [[ ${variable,,} == mimalloc_arena_reserve ]]; then unset "$variable"; fi
        done < <(compgen -e)
        export MIMALLOC_ARENA_RESERVE=64M
        {
        python3 - <<'PYSOURCE'
        from pathlib import Path
        import json,runpy,subprocess
        consumer=Path.cwd().resolve(strict=True)
        lean=Path(subprocess.check_output(['elan','which','lean'],text=True).strip()).resolve(strict=True)
        verify=runpy.run_path(str(consumer/'check-backend07-config-projection-sources.py'))['verify']
        print(json.dumps(verify(consumer/'runtime-function64-root-source-manifest.json','820b44f2059aef58a291e21079183c549ab81cd6952510bdc71649f6754afe2e',consumer,lean.parent.parent)))
        PYSOURCE
        lake --fail-fast build PancakeDiv256.Compiler.Backend07.RuntimeBindings.Node64Smoke
        lake env python3 check-runtime-function64-root.py
        python3 - <<'PYSOURCE'
        from pathlib import Path
        import json,runpy,subprocess
        consumer=Path.cwd().resolve(strict=True)
        lean=Path(subprocess.check_output(['elan','which','lean'],text=True).strip()).resolve(strict=True)
        verify=runpy.run_path(str(consumer/'check-backend07-config-projection-sources.py'))['verify']
        print(json.dumps(verify(consumer/'runtime-function64-root-source-manifest.json','820b44f2059aef58a291e21079183c549ab81cd6952510bdc71649f6754afe2e',consumer,lean.parent.parent)))
        PYSOURCE
        } 2>&1 | tee ../../runtime-function64-root-evidence/build.log
    - name: Recheck exact graph SDK five objects and bounded pilot evidence
      run: |
        python3 - <<'PYTHON'
        import hashlib,json,re,subprocess
        from pathlib import Path
        root=Path.cwd().resolve(strict=True);evidence=root/'runtime-function64-root-evidence'
        before=json.loads((evidence/'sources-before.json').read_bytes())
        if subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()!=before['checkout']or subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()!=before['tree']:raise SystemExit('checkout changed')
        for name,row in before['files'].items():
            path=root/name
            if path.is_symlink()or path.resolve(strict=True)!=path or hashlib.sha256(path.read_bytes()).hexdigest()!=row['sha256']:raise SystemExit('phase source/policy changed')
        for tool,row in before['sdk'].items():
            path=Path(subprocess.check_output(['elan','which',tool],cwd=root/'examples/pancake-div256',text=True).strip()).resolve(strict=True)
            if str(path)!=row['path']or hashlib.sha256(path.read_bytes()).hexdigest()!=row['sha256']or subprocess.check_output([str(path),'--version'],text=True).strip()!=row['version']:raise SystemExit('SDK changed')
        for row in before['prepared_packages'].values():
            commit=subprocess.check_output(['git','-C',row['path'],'rev-parse','HEAD'],text=True).strip();diff=subprocess.check_output(['git','-C',row['path'],'diff','--binary','HEAD','--'])
            if commit!=row['commit']or hashlib.sha256(diff).hexdigest()!=row['diff_sha256']:raise SystemExit('prepared dependency changed')
        text=(evidence/'build.log').read_text();audit=None
        rows=re.findall(r'Function64Root strict audit: 1 owners / (\d+) declarations / (\d+) theorems / 0 offenders',text)
        if len(rows)!=1 or int(rows[0][0])==0 or int(rows[0][1])<2:raise SystemExit('missing Function64 root strict owner audit')
        audit={'owners':1,'theorems':int(rows[0][1]),'unexpected_axioms':0,'only_one_root_and_program_pair':True}
        objects={}
        for name in before['local_modules']:
            relative=name.replace('.','/')+'.olean';path=root/'examples/pancake-div256/.lake/build/lib/lean'/relative
            if not path.is_file()or path.is_symlink()or path.resolve(strict=True)!=path:raise SystemExit('missing/aliased compiled phase object')
            objects[relative]=hashlib.sha256(path.read_bytes()).hexdigest()
        if len(objects)!=5:raise SystemExit('wrong local phase inventory')
        repository_objects={}
        for name in before['repository_modules']:
            relative=name.replace('.','/')+'.olean';path=root/'.lake/build/lib/lean'/relative
            if not path.is_file()or path.is_symlink()or path.resolve(strict=True)!=path:raise SystemExit('missing/aliased repository dependency object')
            repository_objects[relative]=hashlib.sha256(path.read_bytes()).hexdigest()
        if len(repository_objects)!=0:raise SystemExit('repository object inventory changed')
        negative_log=(evidence/'build.log').read_text()
        for name in ['WrongBody64', 'WrongFrame64', 'WrongLabel64']:
            if negative_log.count(name+': actual exit=1\n')!=1:raise SystemExit('missing actual typed negative')
        bounded_raw=(evidence/'bounded-leaves.json').read_bytes();bounded=json.loads(bounded_raw)
        if bounded['verified_pending_workflow_postcheck']is not True or len(bounded['leaves'])!=5:raise SystemExit('incomplete bounded proof pilot')
        expected_profile={'AS_bytes':4*1024**3,'Lean_heap_MiB':3072,'Lean_j':1,'requested_stack_KiB':65536,'LEAN_NUM_THREADS':'1','MIMALLOC_ARENA_RESERVE':'64M','wall_seconds':900,'file_log_bytes':4*1024**2,'attempts':1,'peak_RSS_not_measured':True}
        if json.dumps(bounded['profile'],sort_keys=True)!=json.dumps(expected_profile,sort_keys=True):raise SystemExit('bounded profile metadata changed')
        if bounded['sources_before_sha256']!=hashlib.sha256((evidence/'sources-before.json').read_bytes()).hexdigest():raise SystemExit('bounded preflight binding changed')
        expected_leaves=['Function64Root','Backend07Function64RootChecks','WrongBody64','WrongFrame64','WrongLabel64']
        if [row['name']for row in bounded['leaves']]!=expected_leaves:raise SystemExit('bounded leaf order changed')
        for index,row in enumerate(bounded['leaves']):
            log=evidence/(row['name']+'.log')
            if log.is_symlink()or log.resolve(strict=True)!=log or hashlib.sha256(log.read_bytes()).hexdigest()!=row['log_sha256']:raise SystemExit('bounded leaf log drift')
            result=row['result']
            if type(result['returncode'])is not int or result['returncode']!=(0 if index<2 else 1)or type(result['elapsed_seconds'])not in[int,float]or not 0<=result['elapsed_seconds']<=901 or result['timeout_seconds']!=900 or result['file_limit_bytes']!=4*1024**2:raise SystemExit('bounded leaf outcome mismatch')
            if row['typed_negative']is not(index>=2):raise SystemExit('typed negative outcome changed')
            if index<2:
                module=('PancakeDiv256.Compiler.Backend07.RuntimeBindings.Function64Root'if index==0 else'PancakeDiv256.Compiler.Backend07Function64RootChecks')
                if objects[module.replace('.','/')+'.olean']!=row['output_sha256']:raise SystemExit('bounded output object drift')
            elif row['output_sha256']is not None or(evidence/(row['name']+'.olean')).exists()or(evidence/(row['name']+'.olean')).is_symlink():raise SystemExit('negative proof output exists')
        report={'phase':'runtime-function64-root','certificate':False,'active':False,'source_before_sha256':hashlib.sha256((evidence/'sources-before.json').read_bytes()).hexdigest(),
         'build_log_sha256':hashlib.sha256((evidence/'build.log').read_bytes()).hexdigest(),'audit':audit,'objects':objects,'repository_objects':repository_objects,'typed_negative_leaves':3,'negatives_log_sha256':hashlib.sha256((evidence/'build.log').read_bytes()).hexdigest(),
         'bounded_leaves_sha256':hashlib.sha256(bounded_raw).hexdigest(),'fixed_bounded_profile':bounded['profile'],'runtime_execution':False,'whole817Stack_and_Native_resource_byte_equalities_remain_open':True,'compiler_or_byte_certificate':False,'Root_acceptance':'pending'}
        (evidence/'checked-artifacts.json').write_text(json.dumps(report,indent=2)+'\n')
        print('One Function64 root and program pair checked; all817 Native resource byte obligations remain open')
        PYTHON
    - name: Preserve bounded Function64 root proof pilot evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-function64-root-${{ github.run_id }}-${{ github.run_attempt }}
        if-no-files-found: error
        path: |-
          runtime-function64-root-evidence/sources-before.json
          runtime-function64-root-evidence/build.log
          runtime-function64-root-evidence/bounded-leaves.json
          runtime-function64-root-evidence/Function64Root.log
          runtime-function64-root-evidence/Backend07Function64RootChecks.log
          runtime-function64-root-evidence/WrongBody64.log
          runtime-function64-root-evidence/WrongFrame64.log
          runtime-function64-root-evidence/WrongLabel64.log
          runtime-function64-root-evidence/checked-artifacts.json
          examples/pancake-div256/runtime-function64-root-source-manifest.json
          examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/Backend07/RuntimeBindings/Function64Root.olean
          examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/Backend07Function64RootChecks.olean
