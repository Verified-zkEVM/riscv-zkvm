name: Hint protocol and Pancake consumer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exercise finite providers, process cleanup, and replay
        working-directory: examples/pancake-div256
        run: python3 -m unittest discover -s runtime -p 'test_*.py' -v
      - name: Reproduce Native154 sources and exercise input refusals
        working-directory: examples/pancake-div256
        run: python3 test-backend-native154-structural.py --production-root .

  core-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Build hint regressions and runner
        run: |
          lake build RiscvZkvm.Interpreter.HintTests \
            RiscvZkvm.Interpreter.HintAdapterImportTests riscv-zkvm-run
      - name: Run interpreter fixtures
        run: scripts/run-interpreter-tests.sh
      - name: DIV256 actual-machine differential regressions
        run: |
          python3 scripts/test-div256-timeout.py
          python3 scripts/test-div256.py --timeout 900
          python3 scripts/test-div256.py --backend pancake --timeout 900

  pancake-consumer:
    runs-on: ubuntu-latest
    # The exact guest global-pass certificates add a substantial cold build.
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - directory: pancake-modinv
            target: Op6Pancake
          - directory: pancake-div256
            target: PancakeDiv256
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch isolated Mathlib cache
        working-directory: examples/${{ matrix.directory }}
        run: |
          cmp ../../lean-toolchain lean-toolchain
          lake exe cache get
      - name: Apply recorded Flapjack compatibility patch
        working-directory: examples/${{ matrix.directory }}
        run: python3 prepare-flapjack.py
      - name: Verify pinned external cache source roots
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          manifest = json.loads(Path('lake-manifest.json').read_text())
          pins = {p['name']: p['rev'] for p in manifest['packages'] if p['type'] == 'git'}
          for name in ['Guest', 'flapjack']:
              root = (Path('.lake/packages') / name).resolve(strict=True)
              if not root.is_relative_to(workspace):
                  raise SystemExit(f'external cache package escapes CI workspace: {name}')
              actual = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pins[name]:
                  raise SystemExit(f'wrong pinned package revision: {name}')
          guest = Path('.lake/packages/Guest')
          dirty = subprocess.check_output(['git', '-C', str(guest), 'status', '--porcelain', '--untracked-files=no'])
          if dirty:
              raise SystemExit('Guest tracked sources changed before cache restore')
          PYTHON
      # Cache only pinned upstream build products, after exact patch validation.
      # Sources, example build output, executables and release archives stay out.
      - name: Restore pinned DIV dependency build cache
        if: matrix.directory == 'pancake-div256'
        id: div-dependency-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          enableCrossOsArchive: false
          path: |
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
            examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
          key: div256-external-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}-final
          restore-keys: |
            div256-external-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-
      - name: Build isolated consumer
        working-directory: examples/${{ matrix.directory }}
        run: lake build ${{ matrix.target }}
      # Save completed dependencies before the later proof stages.
      # Pushes write; pull-request runs only restore caches.
      - name: Checkpoint pinned DIV dependency build cache
        if: >-
          matrix.directory == 'pancake-div256' &&
          github.event_name == 'push' &&
          steps.div-dependency-cache.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          enableCrossOsArchive: false
          path: |
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
            examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
          key: div256-external-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}-consumer
      - name: Build reviewed compiler and initialization proofs
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: lake build PancakeDiv256.Deployment.Proofs
      - name: Audit consumer axioms
        working-directory: examples/${{ matrix.directory }}
        run: |
          if [ '${{ matrix.directory }}' = pancake-div256 ]; then
            lake env lean --run AxiomSweep.lean --compiler
          else
            lake env lean --run AxiomSweep.lean
          fi
      - name: Reject unused private axiom dependencies
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: lake env python3 test-axiom-sweep.py
      - name: Build exact-result serializers
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: |
          lake build PancakeDiv256.Compiler.BackendArtifactGenerator \
            PancakeDiv256.Compiler.BackendNativeProposalGenerator \
            PancakeDiv256.Compiler.BackendComputation
      - name: Check generic Native composition equations
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: lake build PancakeDiv256.Compiler.NativeCompositionTests
      - name: Check captured Native function 658 and its source owners
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: lake --fail-fast build PancakeDiv256.Compiler.Native658Checks
      - name: Preserve checked Native658 proof objects
        if: matrix.directory == 'pancake-div256'
        uses: actions/upload-artifact@v4
        with:
          name: native658-oleans-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Allocated658.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Function658.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/Native658Checks.olean
      - name: Check typed proposal roundtrips and producer refusals
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: |
          lake env python3 test-backend-proposals.py --timeout 300
          lake env python3 test-backend-native-proposals.py --timeout 300
          python3 test-producer-controls.py
      - name: Exercise private oracle framing and replay
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: lake env lean --run OracleRegression.lean
      # Preserve completed upstream modules after ordinary failures. A cancelled
      # job may have live writers or a hard deadline; use its earlier checkpoint.
      - name: Save pinned DIV dependency build cache
        if: >-
          always() && !cancelled() &&
          matrix.directory == 'pancake-div256' &&
          github.event_name == 'push' &&
          steps.div-dependency-cache.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          enableCrossOsArchive: false
          path: |
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
            examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
          key: div256-external-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}-final
