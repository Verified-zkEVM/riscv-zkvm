name: Hint protocol and Pancake consumer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exercise finite providers, process cleanup, and replay
        working-directory: examples/pancake-div256
        run: python3 -m unittest discover -s runtime -p 'test_*.py' -v
      - name: Reproduce Native154 sources and exercise input refusals
        working-directory: examples/pancake-div256
        run: python3 test-backend-native154-structural.py --production-root .

  core-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Build hint regressions and runner
        run: |
          lake build RiscvZkvm.Interpreter.HintTests \
            RiscvZkvm.Interpreter.HintAdapterImportTests riscv-zkvm-run
      - name: Run interpreter fixtures
        run: scripts/run-interpreter-tests.sh
      - name: DIV256 actual-machine differential regressions
        run: |
          python3 scripts/test-div256-timeout.py
          python3 scripts/test-div256.py --timeout 900
          python3 scripts/test-div256.py --backend pancake --timeout 900

  pancake-consumer:
    runs-on: ubuntu-latest
    # The exact guest global-pass certificates add a substantial cold build.
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - directory: pancake-modinv
            target: Op6Pancake
          - directory: pancake-div256
            target: PancakeDiv256
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch isolated Mathlib cache
        working-directory: examples/${{ matrix.directory }}
        run: |
          cmp ../../lean-toolchain lean-toolchain
          lake exe cache get
      - name: Apply recorded Flapjack compatibility patch
        working-directory: examples/${{ matrix.directory }}
        run: python3 prepare-flapjack.py
      - name: Verify pinned external cache source roots
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          manifest = json.loads(Path('lake-manifest.json').read_text())
          pins = {p['name']: p['rev'] for p in manifest['packages'] if p['type'] == 'git'}
          for name in ['Guest', 'flapjack']:
              root = (Path('.lake/packages') / name).resolve(strict=True)
              if not root.is_relative_to(workspace):
                  raise SystemExit(f'external cache package escapes CI workspace: {name}')
              actual = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pins[name]:
                  raise SystemExit(f'wrong pinned package revision: {name}')
          guest = Path('.lake/packages/Guest')
          dirty = subprocess.check_output(['git', '-C', str(guest), 'status', '--porcelain', '--untracked-files=no'])
          if dirty:
              raise SystemExit('Guest tracked sources changed before cache restore')
          PYTHON
      # Cache only pinned upstream build products, after exact patch validation.
      # Sources, example build output, executables and release archives stay out.
      - name: Restore completed DIV deployment dependencies
        if: matrix.directory == 'pancake-div256'
        id: div-dependency-complete-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          enableCrossOsArchive: false
          path: |
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
            examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
          key: div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-complete-deployment-proofs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-complete-deployment-proofs-
      - name: Restore DIV dependency progress fallback
        if: >-
          matrix.directory == 'pancake-div256' &&
          steps.div-dependency-complete-cache.outputs.cache-matched-key == ''
        id: div-dependency-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          enableCrossOsArchive: false
          path: |
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
            examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
          key: div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-progress-${{ github.run_id }}-${{ github.run_attempt }}-final
          restore-keys: |
            div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-progress-
            div256-external-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-
      - name: Check original direct-fromStack configuration projection
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: |
          set -euo pipefail
          mkdir -p .lake/build
          {
            python3 check-backend07-config-projection-sources.py --manifest-sha256 971845fda593242e829d6095698220800dbad717ec0601139221e5543b89c680
            lake --fail-fast build PancakeDiv256.Compiler.Backend07ConfigProjectionChecks
            python3 check-backend07-config-projection-sources.py --manifest-sha256 971845fda593242e829d6095698220800dbad717ec0601139221e5543b89c680
          } 2>&1 | tee .lake/build/backend07-config-projection-checks.log
      - name: Reject changed projected GC, register counts and retained config
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: |
          set -euo pipefail
          lake env python3 - <<'PYCONFIG' 2>&1 | tee .lake/build/backend07-config-projection-negatives.log
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          with tempfile.TemporaryDirectory(prefix="backend07-config-projection-negatives-") as directory:
              for name, witness in [("WrongGc", "original_gc_none"), ("WrongRegisterCount", "assembler_register_count"), ("WrongStackRegisterParameter", "stack_register_parameter"), ("WrongRetainedWordConfig", "attach_original_wordConf")]:
                  output = Path(directory) / (name + ".olean")
                  result = subprocess.run(["lean", "-o", str(output), "tests/backend07-config-projection/" + name + ".lean"], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=300)
                  diagnostic = result.stdout
                  print(name + ": expected typed rejection\n" + diagnostic[-20000:])
                  lower = diagnostic.lower()
                  if result.returncode != 1 or output.exists() or output.is_symlink() or lower.count("error:") != 1 or "type mismatch" not in lower or re.search(r"(?<![\w'])" + re.escape(witness) + r"(?![\w'])", diagnostic) is None or any(text in lower for text in ["unknown identifier", "unknown constant", "unknown module", "object file", "unexpected token", "expected token", "unexpected end of input", "unterminated", "parser error", "invalid syntax", "failed to synthesize"]):
                      raise SystemExit(name + ": expected typed proof mismatch without output")
          PYCONFIG
      - name: Preserve focused configuration projection proof evidence
        if: always() && matrix.directory == 'pancake-div256'
        uses: actions/upload-artifact@v4
        with:
          name: backend07-config-projection-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            examples/pancake-div256/.lake/build/backend07-config-projection-checks.log
            examples/pancake-div256/.lake/build/backend07-config-projection-negatives.log
            examples/pancake-div256/backend07-config-projection-source-manifest.json
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/Backend07/ConfigProjection07/RuntimeInputs.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/Backend07/ConfigProjection07/BindingGoals.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/Backend07ConfigProjectionChecks.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/Allocation/Config.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/AllocationConfigChecks.olean
      - name: Check exact bitmap trace and compositional handler rule
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: |
          set -o pipefail
          mkdir -p .lake/build
          lake --fail-fast build PancakeDiv256.Compiler.NativeHandlerTraceChecks 2>&1 | tee .lake/build/native-handler-trace-checks.log
      - name: Reject handler trace order, flattening and counter drift
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: |
          set -o pipefail
          lake env python3 - <<'PYTRACE' 2>&1 | tee .lake/build/native-handler-trace-negatives.log
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          with tempfile.TemporaryDirectory(prefix="native-handler-trace-negatives-") as directory:
              for name, witness in [("WrongOrder", "two_chunks"), ("WrongFlattenedTree", "two_chunks"), ("WrongCounter", "two_chunks")]:
                  output = Path(directory) / (name + ".olean")
                  result = subprocess.run(["lean", "-o", str(output), "tests/native-handler-trace/" + name + ".lean"], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=300)
                  diagnostic = result.stdout
                  print(name + ": actual exit=" + str(result.returncode) + "; expected typed rejection\n" + diagnostic[-20000:])
                  lower = diagnostic.lower()
                  if result.returncode != 1 or output.exists() or output.is_symlink() or lower.count("error:") != 1 or "type mismatch" not in lower or re.search(r"(?<![\w'])" + re.escape(witness) + r"(?![\w'])", diagnostic) is None or any(text in lower for text in ["unknown identifier", "unknown constant", "unknown module", "object file", "unexpected token", "expected token", "unexpected end of input", "unterminated", "parser error", "invalid syntax", "failed to synthesize"]):
                      raise SystemExit(name + ": expected typed proof mismatch without output")
          PYTRACE
      - name: Preserve handler trace proof objects
        if: always() && matrix.directory == 'pancake-div256'
        uses: actions/upload-artifact@v4
        with:
          name: native-handler-trace-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            examples/pancake-div256/.lake/build/native-handler-trace-checks.log
            examples/pancake-div256/.lake/build/native-handler-trace-negatives.log
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendNativeHandlerTrace.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/NativeHandlerTrace/Boundaries.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/NativeHandlerTraceChecks.olean
      - name: Check captured Native immediate comparison functions
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: |
          set -o pipefail
          mkdir -p .lake/build
          lake --fail-fast build PancakeDiv256.Compiler.NativeBranchImmediateChecks 2>&1 | tee .lake/build/native-immediate-checks.log
      - name: Reject changed immediate, spill operand and bitmap state
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: |
          set -o pipefail
          lake env python3 - <<'PYIMM' 2>&1 | tee .lake/build/native-immediate-negatives.log
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          with tempfile.TemporaryDirectory(prefix="native-immediate-negatives-") as directory:
              for name, witness in [("WrongImmediate468", "compiled468_46_eq"), ("WrongSpilledOperand468", "compiled468_46_eq"), ("WrongBitmapState829", "function829_eq")]:
                  output = Path(directory) / (name + ".olean")
                  result = subprocess.run(["lean", "-o", str(output), "tests/native-immediate/" + name + ".lean"], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=300)
                  diagnostic = result.stdout
                  print(name + ": actual exit=" + str(result.returncode) + "; expected typed rejection\n" + diagnostic[-20000:])
                  lower = diagnostic.lower()
                  if result.returncode != 1 or output.exists() or output.is_symlink() or lower.count("error:") != 1 or "type mismatch" not in lower or re.search(r"(?<![\w'])" + re.escape(witness) + r"(?![\w'])", diagnostic) is None or any(text in lower for text in ["unknown identifier", "unknown constant", "unknown module", "object file", "unexpected token", "expected token", "unexpected end of input", "unterminated", "parser error", "invalid syntax", "failed to synthesize"]):
                      raise SystemExit(name + ": expected typed proof mismatch without output")
          PYIMM
      - name: Preserve Native immediate proof objects
        if: always() && matrix.directory == 'pancake-div256'
        uses: actions/upload-artifact@v4
        with:
          name: native-immediate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            examples/pancake-div256/.lake/build/native-immediate-checks.log
            examples/pancake-div256/.lake/build/native-immediate-negatives.log
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Allocated468.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Allocated544.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Allocated829.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot468/Data.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot468/Function.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot468/Proof.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot544/Data.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot544/Function.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot544/Proof.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot829/Data.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot829/Function.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot829/Proof.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/NativeBranchImmediateChecks.olean
      - name: Check eight captured Native conditional and loop functions
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: |
          set -o pipefail
          mkdir -p .lake/build
          lake --fail-fast build PancakeDiv256.Compiler.NativeBranchSmallChecks 2>&1 | tee .lake/build/native-branch-eight-checks.log
      - name: Reject changed eight-branch frame and loop bitmap state
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: |
          set -o pipefail
          lake env python3 - <<'PYEIGHT' 2>&1 | tee .lake/build/native-branch-eight-negatives.log
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          with tempfile.TemporaryDirectory(prefix="native-branch-eight-negatives-") as directory:
              for name, witness in [("WrongFrame539", "function539_eq"), ("WrongLoopOffset270", "compiled270_54_eq"), ("WrongLoopTree270", "compiled270_54_eq")]:
                  output = Path(directory) / (name + ".olean")
                  result = subprocess.run(["lean", "-o", str(output), "tests/native-branch-eight/" + name + ".lean"], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=300)
                  diagnostic = result.stdout
                  print(name + ": actual exit=" + str(result.returncode) + "; expected typed rejection\n" + diagnostic[-20000:])
                  lower = diagnostic.lower()
                  if result.returncode != 1 or output.exists() or output.is_symlink() or lower.count("error:") != 1 or "type mismatch" not in lower or re.search(r"(?<![\w'])" + re.escape(witness) + r"(?![\w'])", diagnostic) is None or any(text in lower for text in ["unknown identifier", "unknown constant", "unknown module", "object file", "unexpected token", "expected token", "unexpected end of input", "unterminated", "parser error", "invalid syntax", "failed to synthesize"]):
                      raise SystemExit(name + ": expected typed proof mismatch without output")
          PYEIGHT
      - name: Preserve eight Native branch proof objects
        if: always() && matrix.directory == 'pancake-div256'
        uses: actions/upload-artifact@v4
        with:
          name: native-branch-eight-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            examples/pancake-div256/.lake/build/native-branch-eight-checks.log
            examples/pancake-div256/.lake/build/native-branch-eight-negatives.log
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Allocated270.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Allocated337.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Allocated475.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Allocated539.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Allocated636.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Allocated640.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Allocated707.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Allocated841.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot270/Data.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot270/Function.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot270/Proof.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot337/Data.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot337/Function.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot337/Proof.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot475/Data.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot475/Function.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot475/Proof.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot539/Data.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot539/Function.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot539/Proof.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot636/Data.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot636/Function.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot636/Proof.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot640/Data.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot640/Function.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot640/Proof.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot707/Data.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot707/Function.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot707/Proof.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot841/Data.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot841/Function.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/NativeBranchPilot841/Proof.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/NativeBranchSmallChecks.olean
      - name: Check three captured Native conditional and loop functions
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: |
          set -o pipefail
          mkdir -p .lake/build
          lake --fail-fast build PancakeDiv256.Compiler.NativeBranchPilotChecks 2>&1 | tee .lake/build/native-branch-pilot-checks.log
      - name: Reject changed Native conditional frame and loop bitmap state
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: |
          set -o pipefail
          lake env python3 - <<'PYBRANCH' 2>&1 | tee .lake/build/native-branch-pilot-negatives.log
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          with tempfile.TemporaryDirectory(prefix="native-branch-pilot-negatives-") as directory:
              for name, witness in [("WrongConditionalFrame406", "compiled406_32_eq"), ("WrongLoopOffset255", "compiled255_54_eq"), ("WrongLoopTree255", "compiled255_54_eq")]:
