name: Hint protocol and Pancake consumer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exercise finite providers, process cleanup, and replay
        working-directory: examples/pancake-div256
        run: python3 -m unittest discover -s runtime -p 'test_*.py' -v
      - name: Reproduce Native154 sources and exercise input refusals
        working-directory: examples/pancake-div256
        run: python3 test-backend-native154-structural.py --production-root .

  core-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Build hint regressions and runner
        run: |
          lake build RiscvZkvm.Interpreter.HintTests \
            RiscvZkvm.Interpreter.HintAdapterImportTests riscv-zkvm-run
      - name: Run interpreter fixtures
        run: scripts/run-interpreter-tests.sh
      - name: DIV256 actual-machine differential regressions
        run: |
          python3 scripts/test-div256-timeout.py
          python3 scripts/test-div256.py --timeout 900
          python3 scripts/test-div256.py --backend pancake --timeout 900

  pancake-consumer:
    runs-on: ubuntu-latest
    # The exact guest global-pass certificates add a substantial cold build.
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - directory: pancake-modinv
            target: Op6Pancake
          - directory: pancake-div256
            target: PancakeDiv256
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch isolated Mathlib cache
        working-directory: examples/${{ matrix.directory }}
        run: |
          cmp ../../lean-toolchain lean-toolchain
          lake exe cache get
      - name: Apply recorded Flapjack compatibility patch
        working-directory: examples/${{ matrix.directory }}
        run: python3 prepare-flapjack.py
      - name: Verify pinned external cache source roots
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          manifest = json.loads(Path('lake-manifest.json').read_text())
          pins = {p['name']: p['rev'] for p in manifest['packages'] if p['type'] == 'git'}
          for name in ['Guest', 'flapjack']:
              root = (Path('.lake/packages') / name).resolve(strict=True)
              if not root.is_relative_to(workspace):
                  raise SystemExit(f'external cache package escapes CI workspace: {name}')
              actual = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pins[name]:
                  raise SystemExit(f'wrong pinned package revision: {name}')
          guest = Path('.lake/packages/Guest')
          dirty = subprocess.check_output(['git', '-C', str(guest), 'status', '--porcelain', '--untracked-files=no'])
          if dirty:
              raise SystemExit('Guest tracked sources changed before cache restore')
          PYTHON
      # Cache only pinned upstream build products, after exact patch validation.
      # Sources, example build output, executables and release archives stay out.
      - name: Restore completed DIV deployment dependencies
        if: matrix.directory == 'pancake-div256'
        id: div-dependency-complete-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          enableCrossOsArchive: false
          path: |
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
            examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
          key: div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-complete-deployment-proofs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-complete-deployment-proofs-
      - name: Restore DIV dependency progress fallback
        if: >-
          matrix.directory == 'pancake-div256' &&
          steps.div-dependency-complete-cache.outputs.cache-matched-key == ''
        id: div-dependency-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          enableCrossOsArchive: false
          path: |
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
            examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
          key: div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-progress-${{ github.run_id }}-${{ github.run_attempt }}-final
          restore-keys: |
            div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-progress-
            div256-external-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-
      - name: Check actual07 constructor rendering and fixed Kernel roundtrips
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: lake env bash test-serializer07.sh "$RUNNER_TEMP/serializer07-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Preserve actual07 serializer fixture evidence
        if: always() && matrix.directory == 'pancake-div256'
        uses: actions/upload-artifact@v4
        with:
          name: serializer07-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/generate-first.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/generate-second.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/SyntheticList.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/SyntheticMixed.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/Actual64.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/Actual65.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/Actual500.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/Actual878.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/Checks.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/comparison.json
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/pins-before.json
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/generated-source-pins.json
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/checked-private-files.json
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/checked-artifacts.json
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/private-lean-path.txt
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/first/proposal-manifest.json
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/first/SOURCE-PROPOSAL-COMPLETE
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/first/INCOMPLETE
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/first/PancakeDiv256/Compiler/Serializer07/Outputs/SyntheticList.lean
