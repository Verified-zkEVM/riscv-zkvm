            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual65/weak-module.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual65/Checks.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual65/Checks.exit-status
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual65/typed-refusal.json
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual65/pins.json
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual65/source/PancakeDiv256/Compiler/Serializer07/Outputs/Actual65.lean
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual500/weak-module.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual500/Checks.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual500/Checks.exit-status
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual500/typed-refusal.json
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual500/pins.json
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual500/source/PancakeDiv256/Compiler/Serializer07/Outputs/Actual500.lean
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual878/weak-module.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual878/Checks.log
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual878/Checks.exit-status
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual878/typed-refusal.json
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual878/pins.json
            ${{ runner.temp }}/serializer07-${{ github.run_id }}-${{ github.run_attempt }}/weak-Actual878/source/PancakeDiv256/Compiler/Serializer07/Outputs/Actual878.lean
      - name: Check Native primitive equations and bitmap boundaries
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: lake --fail-fast build PancakeDiv256.Compiler.NativePrimitiveTests
      - name: Check structural Native575 and its five source owners
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: lake --fail-fast build PancakeDiv256.Compiler.Native575Checks
      - name: Reject changed Native575 offset, frame and bitmap tree
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: |
          lake env python3 - <<'PY575'
          from pathlib import Path
          import subprocess
          import tempfile
          with tempfile.TemporaryDirectory(prefix="native575-negatives-") as directory:
              for name, witness in [("WrongOffset", "function575_eq"), ("WrongFrame", "compiled575_46_eq"), ("WrongBitmapTree", "compiled575_46_eq")]:
                  output = Path(directory) / (name + ".olean")
                  result = subprocess.run(["lean", "-o", str(output), "tests/native575/" + name + ".lean"], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=300)
                  diagnostic = result.stdout
                  print(name + ": expected typed rejection\n" + diagnostic[-20000:])
                  lower = diagnostic.lower()
                  if result.returncode != 1 or output.exists() or output.is_symlink() or lower.count("error:") != 1 or "type mismatch" not in lower or witness not in diagnostic or any(text in lower for text in ["unknown identifier", "unknown constant", "unknown module", "object file"]):
                      raise SystemExit(name + ": expected typed proof mismatch without output")
          PY575
      - name: Check selected six structural Native sequence candidates
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: lake --fail-fast build PancakeDiv256.Compiler.NativeSequenceSelectedChecks
      - name: Reject changed selected Native sequence frame, offset and tree
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: |
          lake env python3 - <<'PYSEQ'
          from pathlib import Path
          import subprocess
          import tempfile
          with tempfile.TemporaryDirectory(prefix="native-sequence-selected-negatives-") as directory:
              for name, witness in [("WrongOffset575", "function575_eq"), ("WrongFrame587", "compiled587_94_eq"), ("WrongTree575", "compiled575_46_eq")]:
                  output = Path(directory) / (name + ".olean")
                  result = subprocess.run(["lean", "-o", str(output), "tests/native-sequence-selected/" + name + ".lean"], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=300)
                  diagnostic = result.stdout
                  print(name + ": expected typed rejection\n" + diagnostic[-20000:])
                  lower = diagnostic.lower()
                  if result.returncode != 1 or output.exists() or output.is_symlink() or lower.count("error:") != 1 or "type mismatch" not in lower or witness not in diagnostic or any(text in lower for text in ["unknown identifier", "unknown constant", "unknown module", "object file"]):
                      raise SystemExit(name + ": expected typed proof mismatch without output")
          PYSEQ
      - name: Build isolated consumer
        working-directory: examples/${{ matrix.directory }}
        run: lake build ${{ matrix.target }}
      # Preserve a cancellation fallback when no completed deployment cache exists.
      # Pushes write; pull-request runs only restore caches.
      - name: Checkpoint pinned DIV dependency build cache
        if: >-
          matrix.directory == 'pancake-div256' &&
          github.event_name == 'push' &&
          steps.div-dependency-complete-cache.outputs.cache-matched-key == '' &&
          (steps.div-dependency-complete-cache.outcome == 'success' ||
           steps.div-dependency-cache.outcome == 'success')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          enableCrossOsArchive: false
          path: |
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
            examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
          key: div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-progress-${{ github.run_id }}-${{ github.run_attempt }}-consumer
      - name: Build reviewed compiler and initialization proofs
        id: div-deployment-proofs
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: lake build PancakeDiv256.Deployment.Proofs
      - name: Save completed DIV deployment dependencies
        if: >-
          steps.div-deployment-proofs.outcome == 'success' &&
          matrix.directory == 'pancake-div256' &&
          github.event_name == 'push' &&
          (steps.div-dependency-complete-cache.outcome == 'success' ||
           steps.div-dependency-cache.outcome == 'success')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          enableCrossOsArchive: false
          path: |
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
            examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
          key: div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-complete-deployment-proofs-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Audit consumer axioms
        working-directory: examples/${{ matrix.directory }}
        run: |
          if [ '${{ matrix.directory }}' = pancake-div256 ]; then
            lake env lean --run AxiomSweep.lean --compiler
          else
            lake env lean --run AxiomSweep.lean
          fi
      - name: Reject unused private axiom dependencies
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: lake env python3 test-axiom-sweep.py
      - name: Build exact-result serializers
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: |
          lake build PancakeDiv256.Compiler.BackendArtifactGenerator \
            PancakeDiv256.Compiler.BackendNativeProposalGenerator \
            PancakeDiv256.Compiler.BackendComputation
      - name: Check generic Native composition equations
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: lake build PancakeDiv256.Compiler.NativeCompositionTests
      - name: Check captured Native function 658 and its source owners
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
          LEAN_NUM_THREADS: 1
        run: lake --fail-fast build PancakeDiv256.Compiler.Native658Checks
      - name: Preserve checked Native658 proof objects
        if: matrix.directory == 'pancake-div256'
        uses: actions/upload-artifact@v4
        with:
          name: native658-oleans-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Allocated658.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/BackendStages/Function658.olean
            examples/pancake-div256/.lake/build/lib/lean/PancakeDiv256/Compiler/Native658Checks.olean
      - name: Check typed proposal roundtrips and producer refusals
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: |
          lake env python3 test-backend-proposals.py --timeout 300
          lake env python3 test-backend-native-proposals.py --timeout 300
          python3 test-producer-controls.py
      - name: Exercise private oracle framing and replay
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: lake env lean --run OracleRegression.lean
      # Preserve upstream progress after ordinary failures. A cancelled
      # job may have live writers or a hard deadline; use its earlier checkpoint.
      - name: Save pinned DIV dependency build cache
        if: >-
          failure() && !cancelled() &&
          matrix.directory == 'pancake-div256' &&
          github.event_name == 'push' &&
          (steps.div-dependency-complete-cache.outcome == 'success' ||
           steps.div-dependency-cache.outcome == 'success')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          enableCrossOsArchive: false
          path: |
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/flapjack/.lake/build/ir
            examples/pancake-div256/.lake/packages/Guest/.lake/build/lib/lean
            examples/pancake-div256/.lake/packages/Guest/.lake/build/ir
          key: div256-external-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'examples/pancake-div256/lean-toolchain', 'examples/pancake-div256/lake-manifest.json', 'examples/pancake-div256/prepare-flapjack.py', 'examples/pancake-div256/patches/flapjack-lean435-compat.patch') }}-progress-${{ github.run_id }}-${{ github.run_attempt }}-final
