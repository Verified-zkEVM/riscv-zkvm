name: Hint protocol and Pancake consumer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Build hint regressions and runner
        run: |
          lake build RiscvZkvm.Interpreter.HintTests \
            RiscvZkvm.Interpreter.Hints RiscvZkvm.Interpreter.NativeFcallTests riscv-zkvm-run
      - name: Build and audit the minimal framework consumer
        working-directory: examples/hint-framework
        run: |
          cmp ../../lean-toolchain lean-toolchain
          lake build Example 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          names = sorted(p['name'] for p in json.loads(Path('lake-manifest.json').read_text())['packages'])
          if names != ['Sail', 'riscv-zkvm']:
              raise SystemExit('Minimal consumer has an unexpected dependency: ' + repr(names))
          log = re.sub(r'\x1b\[[0-9;]*m', '', Path('build.log').read_text())
          if re.search(r'^warning: (?:.*[/\\])?Example\.lean:\d+:\d+:', log, re.MULTILINE):
              raise SystemExit('Minimal consumer has a Lean source warning')
          PY
          lake env lean --run AxiomSweep.lean
      - name: Run interpreter fixtures
        run: scripts/run-interpreter-tests.sh
      - name: DIV256 actual-machine differential regressions
        run: |
          python3 scripts/test-div256-timeout.py
          python3 scripts/test-div256.py --timeout 900

  pancake-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch isolated Mathlib cache
        working-directory: examples/pancake-modinv
        run: |
          cmp ../../lean-toolchain lean-toolchain
          lake exe cache get
      - name: Apply recorded Flapjack compatibility patch
        working-directory: examples/pancake-modinv
        run: python3 prepare-flapjack.py
      - name: Build ordinary-FFI consumer
        working-directory: examples/pancake-modinv
        run: lake build Op6Pancake
      - name: Audit consumer axioms
        working-directory: examples/pancake-modinv
        run: lake env lean --run AxiomSweep.lean
