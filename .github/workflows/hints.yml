      - name: Build exact-result serializers
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: |
          lake build PancakeDiv256.Compiler.BackendArtifactGenerator \
            PancakeDiv256.Compiler.BackendNativeProposalGenerator \
            PancakeDiv256.Compiler.BackendComputation
      - name: Check generic Native composition equations
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        run: lake build PancakeDiv256.Compiler.NativeCompositionTests
      - name: Check captured Native function 658 and its source owners
        if: matrix.directory == 'pancake-div256'
        working-directory: examples/pancake-div256
        env:
