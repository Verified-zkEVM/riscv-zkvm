# Reproducibility record for the checked-in Sail RISC-V Lean extraction.
# Update version/revision/scope fields deliberately, regenerate, then use
# `scripts/check-model-pin.sh --write` to refresh only the digest fields.

[source]
sail_riscv_repo = "https://github.com/riscv/sail-riscv.git"
sail_riscv_tag = "0.13.1"
sail_riscv_rev = "27224ccb2290f022e46213c05b3e72e8a9ea635e"
sail_compiler_version = "0.20.3"
sail_compiler_rev = "60695b1ea377048f0adc39c62671cd099b2ed9f6"

[runtime]
# Official lean-sail v5 passes Sail and SailTest on Lean 4.33.1 without patches.
lean_sail_repo = "https://github.com/rems-project/lean-sail.git"
lean_sail_rev = "079463134b9c50450b8393e1566a09fc492a34d9"
lean_toolchain = "leanprover/lean4:v4.33.1"

[extraction]
root_module = "RiscvZkvm.Sail"
sail_modules = ["main", "I_insts", "M_insts", "Zicsr_insts", "K_core", "Zkr", "Zicboz", "Zicbom_insts"]
config_file = "sail-import/rv64d_v256_e64.json"
config_sha256 = "a3b545eb174247f5552a27dbb60f32c4ee95af85bdc8ea92ce0661254fbff674"
# Rewritten after the 0.13.1 refresh by `scripts/check-model-pin.sh --write`.
model_sha256 = "559bb257093328400e5b47722b0bb8dd004396a8b8c45e32ecaefaa79256d992"
expected_lean_files = 121

[validation]
lean_emulator_source = "https://github.com/riscv/sail-riscv/tree/main/lean_emulator"
lean_emulator_first_release = "0.13"
notes = "The executable Lean emulator is a validation artifact and is not included in the proof-model release archive."
omitted_extension_policy = "Executable validation only: extensions omitted by sail_modules are treated as disabled; the theorem-facing extraction remains unchanged."
last_elf_validation = "2026-10-06: 50/50 selected rv64ui-p tests passed in clean CI with Lean 4.33.1, official lean-sail v5, and Sail 0.20.3"
